config_version: "1.0"
solution_id: max-smart-city
base_url: https://api.example.invalid
openapi: openapi.yaml
FINAL_SYNC_REQUIRED: YES
contract_source_sha: 6b97fed7dd87cf7ed3281314d0a85a0b9e2f4328
final_tg029_sha: PENDING
route_parity: NOT_VERIFIED
missing_merged_schemas:
  - ResidentCreateCaseOptionsQuerySchema
  - ResidentCreateCaseOptionsResponseSchema
  - ContractorCandidatesResponseSchema
pending_contract_source: origin/codex/canonical-public-api-surface-delta
availability: Contract draft. Final runtime registry, transport errors and role projections require TG-029 sync.
test_access:
