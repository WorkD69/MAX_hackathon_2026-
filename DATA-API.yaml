    - UK_EMPLOYEE
    - UK_ADMIN
    - CONTRACTOR_EMPLOYEE
  login: MAX Bot → Mini App → signed initData → новый DemoRun → role switch
  passwords: Не применяются для synthetic roles; рабочие secrets предоставляются командой вне Git.
variables:
  caseId: current case_id
  houseId: current house_id
  categoryId: current category_id
  contractorId: current contractor_id
  appUserId: current eligible app_user_id
  attachmentId: current attachment_id
  premises_id: CreateOptions.selected_premises_id
  category_id: CreateOptions.categories[].category_id
  contractor_id: ContractorCandidates.items[].contractor_id
  iteration_id: Case.current_iteration.iteration_id
  selection_id: SelectContractor.created.selection_id
  assignment_id: SendAssignment.created.assignment_id
  attachment_id: AddResultMaterial.created.attachment_id
  result_id: SubmitResult.created.result_id
  feedback_id: ResidentConfirmation/Remark.created.feedback_id
