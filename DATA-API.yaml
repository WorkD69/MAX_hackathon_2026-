    query: {}
    body: null
    content_type: application/json
    request_schema: null
    test_data:
      classification: SYNTHETIC
      source: docs/submission/SYNTHETIC_DATA.md
      files: []
      prerequisite: Следовать docs/submission/VERIFICATION.md; IDs брать из current options/snapshot/command result,
        без reuse старых targets.
    expected:
      success_code: 200
      response_schema: "#/components/schemas/LiveResponse_output"
      response_shape: LiveResponse
