components:
  securitySchemes:
    ApplicationSession:
      type: http
      scheme: bearer
      bearerFormat: short-lived application session
    MaxWebhookSecret:
      type: apiKey
      in: header
      name: X-Max-Bot-Api-Secret
  schemas:
    LiveResponse_output:
      type: object
      properties:
        status:
          const: ok
          type: string
      required:
        - status
      additionalProperties: false
      x-source-status: IMPLEMENTED_HEALTH_MODULE
    ReadyResponse_output:
      type: object
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          properties:
            database:
              type: string
              enum:
                - up
                - down
            migrations:
              type: string
              enum:
                - current
                - pending
            application:
              type: string
              enum:
                - initialized
                - pending
          required:
            - database
            - migrations
            - application
          additionalProperties: false
      required:
        - status
        - checks
      additionalProperties: false
      x-source-status: IMPLEMENTED_HEALTH_MODULE
    SystemInfoResponseSchema_output:
      type: object
      properties:
        build_sha:
          type: string
          minLength: 1
      required:
        - build_sha
      additionalProperties: false
      x-zod-source: SystemInfoResponseSchema
      x-semantic-validation: Zod refinements и transaction/context rules проверяются runtime; JSON Schema их не заменяет.
    AuthMaxSuccessSchema_output:
      type: object
      properties:
        session_token:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
        session:
          type: object
          properties:
            real_max_identity:
              type: object
              properties:
                max_identity_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                display_name:
                  type: string
                outbound_max_ready:
                  type: boolean
              required:
                - max_identity_id
                - display_name
                - outbound_max_ready
              additionalProperties: false
            demo_mode:
              type: boolean
            demo_run_id:
              anyOf:
